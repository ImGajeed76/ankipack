version: v2
plugins:
  - local: protoc-gen-es
    out: src/generated
    opt:
      - target=ts
      # The package is ESM and tsc does not rewrite import specifiers, so a
      # relative import without `.js` is unresolvable for a Node consumer. Bun
      # resolves it either way, so no test here would catch this being removed.
      - import_extension=js
